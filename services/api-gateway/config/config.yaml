app:
  name: api-gateway
  env: development
  port: 8080
  debug: true
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

jwt:
  secret: "change-me-in-production-32-chars!"
  access_expiry: 15m
  refresh_expiry: 168h

redis:
  addr: localhost:6379
  password: ""
  db: 1

rate_limit:
  requests_per_minute: 60
  burst: 20
  window: 60s
  skip_paths:
    - /health
    - /readyz
    - /metrics

upstream:
  auth_service:    "http://localhost:8081"
  claim_service:   "http://localhost:8082"
  notification_service: "http://localhost:8083"
  ai_service_go:   "http://localhost:8093"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "https://goshield.io"
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Request-ID
    - X-Tenant-ID
  expose_headers:
    - X-Request-ID
  allow_credentials: true
  max_age: 3600

telemetry:
  jaeger_endpoint: "http://localhost:14268/api/traces"
  service_name: api-gateway
  sampling_rate: 1.0
  enabled: true

logger:
  level: debug
  format: json
  service_name: api-gateway
  development: true
