service:
  name: claim-service
  port: 8082
  environment: development
  version: "1.0.0"

database:
  host: localhost
  port: 5432
  user: goshield
  password: goshield_secret
  dbname: goshield
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 20

kafka:
  brokers:
    - localhost:9092
  group_id: claim-service-group
  topic_claims_new: claims.new
  topic_claims_analyzed: claims.analyzed
  topic_claims_flagged: claims.flagged
  topic_claims_failed: claims.failed

storage:
  provider: minio
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: goshield-claims
  use_ssl: false

auth:
  jwt_secret: "change-me-in-production"
  jwt_access_expiry: 15m
  jwt_refresh_expiry: 168h

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: claim-service
  sampling_rate: 1.0
  metrics_enabled: true
  tracing_enabled: true

notification:
  fraud_threshold_flag: 0.80
  fraud_threshold_alert: 0.95
