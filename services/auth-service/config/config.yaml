service:
  name: auth-service
  port: 8081
  environment: development
  version: "1.0.0"

database:
  host: localhost
  port: 5432
  user: goshield
  password: goshield_secret
  dbname: goshield
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: localhost:6379
  password: ""
  db: 0

auth:
  jwt_secret: "change-me-in-production-must-be-32-chars"
  jwt_access_expiry: 15m
  jwt_refresh_expiry: 168h
  oauth_google_client_id: ""
  oauth_google_secret: ""
  oauth_google_callback: "http://localhost:8081/api/v1/auth/oauth/google/callback"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: auth-service
  sampling_rate: 1.0
  metrics_enabled: true
  tracing_enabled: true
