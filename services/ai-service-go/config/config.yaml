service:
  name: ai-service-go
  port: 8093
  environment: development
  version: "1.0.0"

kafka:
  brokers:
    - localhost:9092
  group_id: ai-service-go-group
  topic_claims_new: claims.new
  topic_claims_analyzed: claims.analyzed
  topic_claims_flagged: claims.flagged
  topic_claims_failed: claims.failed

grpc:
  ai_service_addr: "http://localhost:8090"

telemetry:
  otlp_endpoint: "localhost:4317"
  service_name: ai-service-go
  sampling_rate: 1.0
  metrics_enabled: true
  tracing_enabled: true
