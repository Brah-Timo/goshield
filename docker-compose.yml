version: "3.9"

# GoShield — Local Development Stack
# Run: docker compose up -d
# Stop: docker compose down -v

x-common-env: &common-env
  GOSHIELD_DATABASE_HOST: postgres
  GOSHIELD_DATABASE_PORT: "5432"
  GOSHIELD_DATABASE_USER: goshield
  GOSHIELD_DATABASE_PASSWORD: goshield_dev_pass
  GOSHIELD_DATABASE_DBNAME: goshield
  GOSHIELD_DATABASE_SSLMODE: disable
  GOSHIELD_REDIS_ADDR: redis:6379
  GOSHIELD_KAFKA_BROKERS: kafka:9092
  GOSHIELD_STORAGE_PROVIDER: minio
  GOSHIELD_STORAGE_ENDPOINT: minio:9000
  GOSHIELD_STORAGE_ACCESS_KEY: minioadmin
  GOSHIELD_STORAGE_SECRET_KEY: minioadmin123
  GOSHIELD_STORAGE_BUCKET: goshield-claims
  GOSHIELD_AUTH_JWT_SECRET: "super-secret-jwt-key-change-in-prod-must-be-32-chars"
  GOSHIELD_AUTH_JWT_ACCESS_EXPIRY: "15m"
  GOSHIELD_AUTH_JWT_REFRESH_EXPIRY: "168h"
  GOSHIELD_TELEMETRY_OTLP_ENDPOINT: jaeger:4317
  GOSHIELD_TELEMETRY_SAMPLING_RATE: "1.0"
  GOSHIELD_TELEMETRY_METRICS_ENABLED: "true"
  GOSHIELD_TELEMETRY_TRACING_ENABLED: "true"
  GOSHIELD_SERVICE_ENVIRONMENT: development

networks:
  goshield-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
  grafana-data:
  prometheus-data:

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: goshield-postgres
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: goshield
      POSTGRES_PASSWORD: goshield_dev_pass
      POSTGRES_DB: goshield
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshield -d goshield"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goshield-redis
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: goshield-kafka
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: goshield-minio
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: goshield-jaeger
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: goshield-prometheus
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: goshield-grafana
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ── GoShield Services ───────────────────────────────────────────────────────

  migrate:
    image: pressly/goose:latest
    container_name: goshield-migrate
    networks: [goshield-net]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://goshield:goshield_dev_pass@postgres:5432/goshield?sslmode=disable"
    volumes:
      - ./migrations:/migrations
    command: ["-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: goshield-auth
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      <<: *common-env
      GOSHIELD_SERVICE_NAME: auth-service
      GOSHIELD_SERVICE_PORT: "8081"
      GOSHIELD_GRPC_PORT: "50051"
      GOSHIELD_TELEMETRY_SERVICE_NAME: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  claim-service:
    build:
      context: .
      dockerfile: services/claim-service/Dockerfile
    container_name: goshield-claims
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8082:8082"
      - "50052:50052"
    environment:
      <<: *common-env
      GOSHIELD_SERVICE_NAME: claim-service
      GOSHIELD_SERVICE_PORT: "8082"
      GOSHIELD_GRPC_PORT: "50052"
      GOSHIELD_TELEMETRY_SERVICE_NAME: claim-service
      GOSHIELD_GRPC_AUTH_SERVICE_ADDR: auth-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service-py:
    build:
      context: .
      dockerfile: services/ai-service-py/Dockerfile
    container_name: goshield-ai-py
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      MODEL_PATH: /app/models/fraud_model_v1.pkl
      LOG_LEVEL: info
    volumes:
      - ./ai/models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-service-go:
    build:
      context: .
      dockerfile: services/ai-service-go/Dockerfile
    container_name: goshield-ai-go
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "50053:50053"
    environment:
      <<: *common-env
      GOSHIELD_SERVICE_NAME: ai-service-go
      GOSHIELD_GRPC_PORT: "50053"
      GOSHIELD_TELEMETRY_SERVICE_NAME: ai-service-go
      AI_PYTHON_SERVICE_URL: "http://ai-service-py:8083"
    depends_on:
      kafka:
        condition: service_healthy
      ai-service-py:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50053"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: goshield-notification
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8084:8084"
      - "50054:50054"
    environment:
      <<: *common-env
      GOSHIELD_SERVICE_NAME: notification-service
      GOSHIELD_SERVICE_PORT: "8084"
      GOSHIELD_GRPC_PORT: "50054"
      GOSHIELD_TELEMETRY_SERVICE_NAME: notification-service
      GOSHIELD_NOTIFICATION_SMTP_HOST: "mailhog"
      GOSHIELD_NOTIFICATION_SMTP_PORT: "1025"
      GOSHIELD_NOTIFICATION_SMTP_FROM: "noreply@goshield.io"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: goshield-gateway
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      GOSHIELD_SERVICE_NAME: api-gateway
      GOSHIELD_SERVICE_PORT: "8080"
      GOSHIELD_TELEMETRY_SERVICE_NAME: api-gateway
      GOSHIELD_GRPC_AUTH_SERVICE_ADDR: auth-service:50051
      GOSHIELD_GRPC_CLAIM_SERVICE_ADDR: claim-service:50052
      GOSHIELD_GRPC_NOTIFICATION_SERVICE_ADDR: notification:50054
    depends_on:
      - auth-service
      - claim-service
      - notification
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Development Utilities ───────────────────────────────────────────────────

  mailhog:
    image: mailhog/mailhog:latest
    container_name: goshield-mailhog
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: goshield-kafka-ui
    restart: unless-stopped
    networks: [goshield-net]
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: goshield-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
