apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-go
  namespace: goshield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service-go
  template:
    metadata:
      labels:
        app: ai-service-go
    spec:
      containers:
        - name: ai-service-go
          image: goshield/ai-service-go:latest
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef: { name: goshield-config }
            - secretRef:    { name: goshield-secrets }
          env:
            - name: GOSHIELD_GRPC_AI_SERVICE_ADDR
              value: "http://ai-py-svc:8090"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8093 }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-go-svc
  namespace: goshield
spec:
  selector: { app: ai-service-go }
  ports:
    - port: 8093
      targetPort: 8093
