apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: goshield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: goshield/api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: goshield-config }
            - secretRef:    { name: goshield-secrets }
          env:
            - name: GOSHIELD_UPSTREAM_AUTH_SERVICE
              value: "http://auth-svc:8081"
            - name: GOSHIELD_UPSTREAM_CLAIM_SERVICE
              value: "http://claim-svc:8082"
            - name: GOSHIELD_UPSTREAM_NOTIFICATION_SERVICE
              value: "http://notification-svc:8083"
            - name: GOSHIELD_UPSTREAM_AI_SERVICE_GO
              value: "http://ai-go-svc:8093"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: goshield
spec:
  selector: { app: api-gateway }
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: goshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
