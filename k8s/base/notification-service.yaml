apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: goshield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: goshield/notification-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef: { name: goshield-config }
            - secretRef:    { name: goshield-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-svc
  namespace: goshield
spec:
  selector: { app: notification-service }
  ports:
    - port: 8083
      targetPort: 8083
