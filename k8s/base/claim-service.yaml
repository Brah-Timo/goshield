apiVersion: apps/v1
kind: Deployment
metadata:
  name: claim-service
  namespace: goshield
  labels:
    app: claim-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claim-service
  template:
    metadata:
      labels:
        app: claim-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: claim-service
          image: goshield/claim-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef: { name: goshield-config }
            - secretRef:    { name: goshield-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: claim-svc
  namespace: goshield
spec:
  selector: { app: claim-service }
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claim-service-hpa
  namespace: goshield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claim-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
